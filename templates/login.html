<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DDoS Sentinel Security Console Login Gateway">
    <title>DDoS Sentinel - Security Gateway Authentication</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom stylesheet link -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --bg-dark: #060912;
            --bg-card: rgba(16, 22, 35, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-cyan: #06b6d4;
            --accent-rose: #f43f5e;
            --text-primary: #f1f5f9;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 10% 20%, rgba(6, 182, 212, 0.07) 0px, transparent 40%),
                radial-gradient(at 90% 80%, rgba(244, 63, 94, 0.05) 0px, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(6, 182, 212, 0.15) !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            background: var(--bg-card) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px !important;
            padding: 3rem 2.5rem !important;
            transition: all 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(6, 182, 212, 0.35) !important;
            box-shadow: 0 25px 60px rgba(6, 182, 212, 0.08);
            transform: translateY(-2px);
        }

        .security-badge {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            font-size: 2rem;
            animation: float-pulse 3s ease-in-out infinite;
        }

        @keyframes float-pulse {
            0% { transform: translateY(0) scale(1); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.2); }
            50% { transform: translateY(-5px) scale(1.03); box-shadow: 0 0 15px 3px rgba(6, 182, 212, 0.35); }
            100% { transform: translateY(0) scale(1); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.2); }
        }

        .form-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-group-text {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-secondary) !important;
            border-radius: 8px 0 0 8px !important;
        }

        .form-control {
            border-radius: 0 8px 8px 0 !important;
        }

        .btn-cyan {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: #fff;
            font-weight: 600;
            border: none;
            padding: 0.75rem !important;
            border-radius: 8px !important;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }

        .btn-cyan:hover {
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.35);
        }

        .error-banner {
            border-color: rgba(244, 63, 94, 0.25) !important;
            background: rgba(244, 63, 94, 0.08) !important;
            color: var(--accent-rose) !important;
            font-size: 0.8rem;
            border-radius: 8px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .creds-note {
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 1.2rem;
            margin-top: 1.5rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card login-card animate-slide-up" id="auth-panel">
        <!-- Security Emblem -->
        <div class="security-badge" id="lock-emblem">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1 text-white">DDoS Sentinel</h4>
            <p class="text-secondary small mb-0">Intrusion Prevention Gateway</p>
        </div>

        <!-- Error Notification -->
        {% if error %}
        <div class="alert error-banner py-2 px-3 mb-3 text-center border d-flex align-items-center justify-content-center gap-2" id="error-toast">
            <i class="fa-solid fa-triangle-exclamation"></i> <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Authentication Form -->
        <form action="/login" method="post" id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label">Operator Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user-shield"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus autocomplete="off">
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Security Passcode</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter passcode" required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-cyan text-uppercase" id="submit-auth-btn">
                    Authenticate Gate <i class="fa-solid fa-right-to-bracket ms-1"></i>
                </button>
            </div>
        </form>

        <!-- Credentials Hint -->
        <div class="creds-note" id="admin-credentials-hint">
            <i class="fa-solid fa-circle-info text-cyan me-1"></i> Use credentials <strong>admin</strong> / <strong>admin</strong> for presentation.
        </div>
    </div>
</body>

</html>
